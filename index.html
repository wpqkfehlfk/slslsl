<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>금딸 캘린더</title>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #18181c;
      --card-sub: #24242a;
      --accent: #3b82f6;
      --accent-danger: #ef4444;
      --accent-success: #10b981;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border: #2e2e38;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 80px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background: var(--card-sub);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-danger { background: var(--accent-danger); border-color: var(--accent-danger); color: #fff; }
    .btn-success { background: var(--accent-success); border-color: var(--accent-success); color: #fff; }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      text-align: center;
      margin: 16px 0;
      color: var(--accent);
    }
    .timer-sub {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-day-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      padding-bottom: 6px;
    }
    .cal-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--card-sub);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-cell.empty { background: transparent; }
    .cal-cell.today { border: 2px solid var(--accent); font-weight: 700; }
    .cal-cell.status-success { background: #064e3b; color: #6ee7b7; }
    .cal-cell.status-fail { background: #7f1d1d; color: #fca5a5; }

    .media-box {
      width: 100%;
      min-height: 180px;
      background: var(--card-sub);
      border-radius: 12px;
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 12px 0;
    }
    .media-box img, .media-box video {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
    }
    .touch-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
    }
    .breathing-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.2);
      border: 3px solid var(--accent);
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: transform 4s ease-in-out;
    }
    .breathing-circle.expand { transform: scale(1.4); }
    .breathing-circle.shrink { transform: scale(0.9); }

    .btn-row { display: flex; gap: 8px; }
    .btn-full { width: 100%; }
    .log-list { font-size: 0.85rem; color: var(--text-sub); display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 타이머 & 오늘 체크 -->
  <div class="card">
    <div class="card-title">
      <span>금딸 지속 시간</span>
      <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="resetStreak()">딸침 (리셋)</button>
    </div>
    <div class="timer-display" id="streakTimer">00일 00:00:00</div>
    <div class="timer-sub" id="streakStartDate">시작 시각: 계산 중...</div>

    <div class="btn-row">
      <button class="btn btn-success btn-full" onclick="recordDailyStatus('success')">오늘 금딸 성공</button>
      <button class="btn btn-danger btn-full" onclick="recordDailyStatus('fail')">오늘 딸침 (실패)</button>
    </div>
  </div>

  <!-- 2. 긴급 충동 대처 -->
  <button class="btn btn-primary btn-full" style="padding: 14px; font-weight: 700;" onclick="openEmergencyModal()">
    🚨 딸치고 싶을 때 누르기 (호흡 & 대체행동)
  </button>

  <!-- 3. 시청 & 자지 건드렸는지 체크 -->
  <div class="card">
    <div class="card-title">야동/사진 시청 & 자지 터치 기록</div>
    <p style="font-size: 0.85rem; color: var(--text-sub);">
      폰이나 컴퓨터에 있는 사진·영상을 불러와서 보고 난 뒤 자지를 건드렸는지 기록합니다. 외부로 파일이 전송되지 않습니다.
    </p>

    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
    <button class="btn btn-full" style="margin-top: 10px;" onclick="document.getElementById('mediaInput').click()">
      📂 사진/영상 파일 불러오기
    </button>

    <div class="media-box" id="mediaContainer">
      <span style="font-size: 0.85rem; color: var(--text-sub);">선택된 파일 없음</span>
    </div>

    <div class="touch-options">
      <button class="btn btn-success" onclick="recordSession(false)">🛡️ 자지 안 건드림</button>
      <button class="btn btn-danger" onclick="recordSession(true)">⚠️ 자지 건드림</button>
    </div>

    <div id="sessionHistory" class="log-list" style="margin-top: 14px;"></div>
  </div>

  <!-- 4. 금딸 캘린더 -->
  <div class="card">
    <div class="cal-header">
      <button class="btn" style="padding: 4px 8px;" onclick="changeMonth(-1)">&lt;</button>
      <span id="calMonthTitle" style="font-weight: 600;">2026년 00월</span>
      <button class="btn" style="padding: 4px 8px;" onclick="changeMonth(1)">&gt;</button>
    </div>
    <div class="cal-grid" id="calWeekdays">
      <div class="cal-day-label">일</div>
      <div class="cal-day-label">월</div>
      <div class="cal-day-label">화</div>
      <div class="cal-day-label">수</div>
      <div class="cal-day-label">목</div>
      <div class="cal-day-label">금</div>
      <div class="cal-day-label">토</div>
    </div>
    <div class="cal-grid" id="calBody"></div>
    <div style="font-size: 0.75rem; color: var(--text-sub); margin-top: 10px; display: flex; gap: 12px; justify-content: flex-end;">
      <span>🟢 금딸 성공</span>
      <span>🔴 딸침 (기록 안 한 날 포함)</span>
    </div>
  </div>

  <!-- 5. 백업 관리 -->
  <div class="card">
    <div class="card-title">데이터 백업/복원</div>
    <div class="btn-row">
      <button class="btn btn-full" onclick="exportData()">기록 백업 (JSON)</button>
      <button class="btn btn-full" onclick="document.getElementById('importFile').click()">기록 불러오기</button>
      <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
    </div>
  </div>

</div>

<!-- 충동 완화 모달 -->
<div class="modal-overlay" id="emergencyModal">
  <div class="modal-content">
    <h3>딸칠 생각 끄기</h3>
    <div class="breathing-circle" id="breathCircle">준비</div>
    <p id="breathText" style="font-size: 0.95rem; margin-bottom: 16px; color: var(--text-sub);">손 떼고 화면 보면서 숨 쉬세요.</p>
    
    <div style="background: var(--card-sub); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
      <span style="font-size: 0.8rem; color: var(--text-sub);">지금 바로 할 짓</span>
      <p id="subActionText" style="font-weight: 600; margin-top: 4px;">팔굽혀펴기 25회</p>
    </div>

    <button class="btn btn-full" onclick="closeEmergencyModal()">참았다 (닫기)</button>
  </div>
</div>

<script>
  const STORAGE_KEYS = {
    STREAK_START: 'nofap_streak_start',
    DAILY_LOGS: 'nofap_daily_status',
    SESSIONS: 'nofap_media_sessions'
  };

  let currentCalDate = new Date();

  function initStreak() {
    let start = localStorage.getItem(STORAGE_KEYS.STREAK_START);
    if (!start) {
      start = new Date().toISOString();
      localStorage.setItem(STORAGE_KEYS.STREAK_START, start);
    }
    updateTimerDisplay();
    setInterval(updateTimerDisplay, 1000);
  }

  function updateTimerDisplay() {
    const start = new Date(localStorage.getItem(STORAGE_KEYS.STREAK_START));
    const now = new Date();
    const diff = Math.max(0, now - start);

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const mins = Math.floor((diff / (1000 * 60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('streakTimer').innerText = 
      `${days}일 ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    document.getElementById('streakStartDate').innerText = 
      `시작 시각: ${start.getFullYear()}.${start.getMonth()+1}.${start.getDate()} ${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`;
  }

  function resetStreak() {
    if (confirm("딸쳤습니까? 타이머가 초기화되고 오늘 기록은 실패로 저장됩니다.")) {
      localStorage.setItem(STORAGE_KEYS.STREAK_START, new Date().toISOString());
      recordDailyStatus('fail');
      updateTimerDisplay();
    }
  }

  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function getDailyLogs() {
    return JSON.parse(localStorage.getItem(STORAGE_KEYS.DAILY_LOGS) || '{}');
  }

  function recordDailyStatus(status) {
    const logs = getDailyLogs();
    const today = getTodayKey();
    logs[today] = status;
    localStorage.setItem(STORAGE_KEYS.DAILY_LOGS, JSON.stringify(logs));
    if (status === 'fail') {
      localStorage.setItem(STORAGE_KEYS.STREAK_START, new Date().toISOString());
      updateTimerDisplay();
    }
    renderCalendar();
    alert(`오늘 상태: '${status === 'success' ? '금딸 성공' : '딸침(실패)'}' 기록 완료`);
  }

  function changeMonth(delta) {
    currentCalDate.setMonth(currentCalDate.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const logs = getDailyLogs();
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    
    document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const calBody = document.getElementById('calBody');
    calBody.innerHTML = '';

    const todayStr = getTodayKey();
    const todayDateObj = new Date();
    todayDateObj.setHours(0, 0, 0, 0);

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'cal-cell empty';
      calBody.appendChild(emptyCell);
    }

    for (let day = 1; day <= lastDate; day++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.innerText = day;

      const dateKey = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const cellDateObj = new Date(year, month, day);

      if (dateKey === todayStr) {
        cell.classList.add('today');
      }

      const status = logs[dateKey];

      // 과거 날짜 중 '성공' 체크가 없으면 전부 딸친 걸로 간주 (빨간색)
      if (cellDateObj < todayDateObj) {
        if (status === 'success') {
          cell.classList.add('status-success');
        } else {
          cell.classList.add('status-fail');
        }
      } else if (dateKey === todayStr) {
        if (status === 'success') cell.classList.add('status-success');
        else if (status === 'fail') cell.classList.add('status-fail');
      }

      calBody.appendChild(cell);
    }
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const container = document.getElementById('mediaContainer');
    container.innerHTML = '';

    const url = URL.createObjectURL(file);

    if (file.type.startsWith('video/')) {
      const video = document.createElement('video');
      video.src = url;
      video.controls = true;
      video.autoplay = false;
      container.appendChild(video);
    } else if (file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = url;
      container.appendChild(img);
    }
  }

  function recordSession(touched) {
    const sessions = JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSIONS) || '[]');
    const now = new Date();
    const record = {
      timestamp: now.toISOString(),
      dateStr: `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
      touched: touched
    };

    sessions.unshift(record);
    if (sessions.length > 30) sessions.pop();
    localStorage.setItem(STORAGE_KEYS.SESSIONS, JSON.stringify(sessions));

    renderSessions();
    alert(`기록 완료: ${touched ? '⚠️ 자지 건드림' : '🛡️ 자지 안 건드리고 시청함'}`);
  }

  function renderSessions() {
    const sessions = JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSIONS) || '[]');
    const container = document.getElementById('sessionHistory');
    if (sessions.length === 0) {
      container.innerHTML = '<span>최근 시청 기록이 없습니다.</span>';
      return;
    }

    container.innerHTML = sessions.slice(0, 3).map(s => `
      <div>• ${s.dateStr} - ${s.touched ? '<span style="color:var(--accent-danger)">자지 건드림</span>' : '<span style="color:var(--accent-success)">자지 안 건드림</span>'}</div>
    `).join('');
  }

  let breathInterval = null;
  const actions = [
    "팔굽혀펴기 30회 실시",
    "찬물로 세수하고 물 한 컵 마시기",
    "자리에서 일어나 스쿼트 30회",
    "방 불 켜고 청소하기",
    "바깥 바람 쐬고 오기"
  ];

  function openEmergencyModal() {
    document.getElementById('emergencyModal').classList.add('active');
    document.getElementById('subActionText').innerText = actions[Math.floor(Math.random() * actions.length)];
    startBreathing();
  }

  function closeEmergencyModal() {
    document.getElementById('emergencyModal').classList.remove('active');
    clearInterval(breathInterval);
  }

  function startBreathing() {
    const circle = document.getElementById('breathCircle');
    const text = document.getElementById('breathText');
    let phase = 0;

    function step() {
      if (phase === 0) {
        circle.className = 'breathing-circle expand';
        circle.innerText = '들숨';
        text.innerText = '코로 깊게 들이마시기 (4초)';
        phase = 1;
        breathInterval = setTimeout(step, 4000);
      } else if (phase === 1) {
        circle.className = 'breathing-circle';
        circle.innerText = '숨 멈춤';
        text.innerText = '손 떼고 가만히 멈추기 (4초)';
        phase = 2;
        breathInterval = setTimeout(step, 4000);
      } else {
        circle.className = 'breathing-circle shrink';
        circle.innerText = '날숨';
        text.innerText = '입으로 천천히 내쉬기 (6초)';
        phase = 0;
        breathInterval = setTimeout(step, 6000);
      }
    }
    step();
  }

  function exportData() {
    const data = {
      streak: localStorage.getItem(STORAGE_KEYS.STREAK_START),
      daily: getDailyLogs(),
      sessions: JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSIONS) || '[]')
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `nofap_backup_${getTodayKey()}.json`;
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (data.streak) localStorage.setItem(STORAGE_KEYS.STREAK_START, data.streak);
        if (data.daily) localStorage.setItem(STORAGE_KEYS.DAILY_LOGS, JSON.stringify(data.daily));
        if (data.sessions) localStorage.setItem(STORAGE_KEYS.SESSIONS, JSON.stringify(data.sessions));
        
        updateTimerDisplay();
        renderCalendar();
        renderSessions();
        alert('기록 불러오기가 완료되었습니다.');
      } catch (err) {
        alert('올바른 백업 파일이 아닙니다.');
      }
    };
    reader.readAsText(file);
  }

  window.onload = function() {
    initStreak();
    renderCalendar();
    renderSessions();
  };
</script>

</body>
</html>
